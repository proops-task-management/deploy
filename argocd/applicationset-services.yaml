# 5 services × 3 environments = 15 Applications, from one file.
#
# WHY A MATRIX GENERATOR AND NOT 15 HAND-WRITTEN APPLICATIONS: the 15 differ in
# exactly two fields — the source path and the destination namespace. Fifteen
# near-identical files drift; one generator cannot. Onboarding a sixth service
# is one line in `services` below, not three new files.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: platform
spec:
  # REQUIRED by the `{{.service}}` syntax below — do not remove (added 2026-09-24, D12).
  # ApplicationSet has TWO template engines. The default is fasttemplate, whose syntax
  # is `{{service}}` with NO leading dot; `{{.service}}` is Go template and is only
  # evaluated when this is true. With it unset, nothing substitutes: every Application
  # is named the literal string `{{.service}}-{{.env}}`, which fails RFC 1123 and makes
  # all 15 "duplicates" of each other. The generator still reports
  # `ParametersGenerated: True` — the parameters were fine; only rendering was not.
  goTemplate: true
  # Fail loudly on an unknown key instead of rendering it as an empty string. Without
  # this, a typo like `{{.svc}}` yields `-dev` — a valid name for the wrong thing.
  goTemplateOptions:
    - missingkey=error

  # Orphaned resources stay put if this ApplicationSet is deleted — deleting the
  # generator should not take 15 running services with it. Removal is deliberate:
  # delete the child Applications, or set this to `background`.
  syncPolicy:
    preserveResourcesOnDeletion: true

  generators:
    - matrix:
        generators:
          - list:
              elements:
                - service: frontend-service
                - service: api-gateway
                - service: user-service
                - service: task-service
                - service: notification-service
          - list:
              elements:
                # `auto` drives syncPolicy below. dev reconciles continuously;
                # staging and prod land on merge of a promotion PR — the review
                # IS the gate, so no manual Sync click is required (IRD-017).
                - env: dev
                  auto: "true"
                - env: staging
                  auto: "true"
                - env: prod
                  auto: "true"

  template:
    metadata:
      name: '{{.service}}-{{.env}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/proops-task-management/deploy.git
        targetRevision: main
        path: 'apps/{{.service}}/overlays/{{.env}}'
        # --enable-helm is NOT set here, and cannot be: Argo CD takes kustomize
        # build flags only from `kustomize.buildOptions` in argocd-cm. That is set
        # by iac-platform's argocd-bootstrap role (`argocd_helm_values`). Without
        # it, every overlay below fails with "must specify --enable-helm".
        #
        # Corrected 2026-09-22 (D12, $0 pre-flight): this block used to carry
        # `kustomize.version: v5.8.1`. In Argo that field names a binary
        # REGISTERED in argocd-cm (`kustomize.path.v5.8.1`), not a version to
        # fetch — none was registered, so it would have failed every app. Argo's
        # bundled kustomize is used instead. Accepted cost: the CI render gate
        # pins v5.8.1 and the cluster renders with Argo's bundled version, so a
        # feature newer than the bundled one could pass CI and fail at sync.
      destination:
        server: https://kubernetes.default.svc
        # THIS is what places every resource in the right namespace. The chart's
        # templates deliberately do not emit `metadata.namespace` (Helm
        # convention: the install target decides), and kustomize's `namespace:`
        # does not reach chart-inflated resources. See the long note in any
        # overlay's kustomization.yaml — verified, not assumed.
        namespace: '{{.env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m

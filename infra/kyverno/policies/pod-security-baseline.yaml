# DEPRECATION: see the note in disallow-latest-tag.yaml — kyverno.io/v1
# ClusterPolicy is deprecated as of 1.19; migration to policies.kyverno.io
# ValidatingPolicy is tracked in Linear as its own change.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  # Named per IRD-021 §Kyverno policy set. D12 (MIN-16) shipped this as
  # `require-pod-hardening` — a name coined without reading the IRD, which had
  # decided `pod-security-baseline` in July. Renamed in MIN-73: a policy the
  # docs call by one name and the cluster by another is a search that fails
  # during an incident.
  name: pod-security-baseline
  annotations:
    policies.kyverno.io/title: Require hardened pod security
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Workloads must run as a non-root user, drop ALL Linux capabilities, refuse
      privilege escalation and use the RuntimeDefault seccomp profile. IRD-021.
      The app chart (charts/app) hardcodes all four rather than exposing them in
      values.yaml, so a conforming workload passes this policy BY CONSTRUCTION —
      this policy exists to catch what does not come from that chart: a
      hand-written manifest, an upstream infra chart's defaults, or a future
      values file that finds a way around the template.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Audit at D12, Enforce at D17 — same reasoning as disallow-latest-tag.
  # KNOWN CONSEQUENCE, recorded rather than discovered later: frontend-service
  # currently runs nginx as ROOT (Trivy DS-0002, Linear MIN-38). It will violate
  # this policy the moment it is deployed. That is not a reason to weaken the
  # rule — MIN-38 is High priority and blocks D16 precisely because of it.
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      # IRD-021 §Rollout exclusions — one comment per namespace, per the IRD.
      # Written ONCE as a YAML anchor (&system-namespaces) and reused by every
      # later rule in this file via the alias (*system-namespaces): the list and
      # its reasons cannot drift between rules of the same policy.
      exclude: &system-namespaces
        any:
          - resources:
              namespaces:
                # k3s's own system components (CoreDNS, Traefik, metrics-server,
                # local-path-provisioner) — shipped and managed by k3s, not by
                # this repo; we cannot change their manifests.
                - kube-system
                # Argo CD / ESO / Kyverno internals — upstream charts that
                # legitimately deviate; blocking them would break the very
                # controllers that deliver and enforce everything else.
                - platform
                # Prometheus / Loki / Tempo / Grafana / Alertmanager — upstream
                # charts legitimately deviate (e.g. node-exporter needs host access).
                - monitoring
      validate:
        message: "runAsNonRoot must be true (pod or every container)."
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: true

    - name: require-drop-all-capabilities
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude: *system-namespaces   # same IRD-021 exclusions, reasons above
      validate:
        message: "Every container must drop ALL capabilities."
        pattern:
          spec:
            containers:
              - securityContext:
                  capabilities:
                    drop:
                      - ALL

    - name: disallow-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude: *system-namespaces   # same IRD-021 exclusions, reasons above
      validate:
        message: "allowPrivilegeEscalation must be false on every container."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false

    - name: require-seccomp-runtime-default
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude: *system-namespaces   # same IRD-021 exclusions, reasons above
      validate:
        message: "seccompProfile.type must be RuntimeDefault (pod or every container)."
        anyPattern:
          - spec:
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
          - spec:
              containers:
                - securityContext:
                    seccompProfile:
                      type: RuntimeDefault

name: secret-scan

# The secret gate for this repo (IRD-021). Same shape as iac-platform's (MIN-62)
# and cicd-platform's self-ci (MIN-63): a SEPARATE workflow, with NO `paths:`
# filter, on every PR and every push to main.
#
# WHY NOT a job inside deploy-pr-opened.yml: that workflow is paths-triggered
# (charts/**, apps/**, infra/**, …). A credential can land in ANY file — a
# README, a stray .json, a values file someone pasted a token into. A secret
# gate sitting behind a path filter is a gate wired to a trigger that does not
# always fire. That is the MIN-60 defect, and the secret gate is the worst place
# in the program to repeat it.
#
# WHY IT MATTERS MORE HERE THAN IN ANY OTHER REPO: `deploy` is PUBLIC git, by
# design — IRD-017 §Bootstrap makes it public precisely so Argo CD needs no repo
# credential. That design choice is sound, and its cost is that a leaked secret
# here is not "in a private repo someone might clone"; it is indexed and
# harvested by scrapers within minutes of the push. Every other repo's secret
# gate protects against a slow leak. This one protects against an instant one.
#
# WHY the local pre-commit hook is not enough: it is bypassable three ways that
# never touch a developer machine — a clone that never ran `task hooks`,
# `git commit --no-verify`, and an edit made through the GitHub web UI or by an
# agent. A lint miss is a bug; a secret miss is a credential in immutable
# history, and no follow-up commit fixes that.
#
# WHY the shared composite action and NOT gitleaks/gitleaks-action@v2: that
# Action refuses to run on ORGANIZATION accounts without a paid
# GITLEAKS_LICENSE, and this repo is org-owned — TSG-005, ~20 min lost at D3
# before the binary workaround was found. cicd-platform's gitleaks-scan action
# runs the Apache-2.0 BINARY directly, which carries no such restriction.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # VERSION PASSED EXPLICITLY, not left to the action's default — relying on
      # that default would put THIS repo's lockstep with its OWN
      # .pre-commit-config.yaml at the mercy of an edit in another repo.
      # Bump both in one commit or not at all (the TSG-020 lesson).
      #
      # RULESET: gitleaks' DEFAULT rules, deliberately. No .gitleaks.toml exists
      # in any repo in the program. Creating an empty one would be worse than
      # having none — an allowlist that exists is an invitation to widen it, and
      # TSG-010's standing rule is to fix the SOURCE, never broaden the rule. If
      # a false positive ever genuinely needs muting, scope it to a single
      # finding fingerprint in .gitleaksignore, never a rule- or path-wide mute.
      - name: Scan for committed secrets (gitleaks)
        uses: proops-task-management/cicd-platform/.github/actions/gitleaks-scan@v6
        with:
          version: "8.18.4"   # keep in lockstep with .pre-commit-config.yaml rev v8.18.4

{{- if .Values.externalSecret.enabled }}
# Pulls the service's secrets from AWS SSM Parameter Store into a namespaced
# Secret, via the ClusterSecretStore that ESO installs at D13 (IRD-019).
# Values-gated and OFF by default: at D12 no ESO exists, so nothing references it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "app.name" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    # Wave -2: secrets must exist before the workload that consumes them (wave 0).
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecret.targetName | default (printf "%s-secrets" (include "app.name" .)) }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "externalSecret.remoteKey is required when externalSecret.enabled" .Values.externalSecret.remoteKey }}
{{- end }}
